<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>gmtk</title>
    </head>
    <body>
        <div class="scanline"></div>

        <div class="main-screen main-screen-intro" id="crt-screen">
            <span class="date">12/31/1999</span>
            <div class="intro">
                <span id="intro-1">>Quick, quick, Janitor!</span><br />
                <span id="intro-1">>it’s almost midnight.</span><br />
                <span id="intro-1">>all the numbers shall descend to zero,</span
                ><br />
                <span id="intro-1">>before we may enter the 21th century.</span
                ><br />
                <span id="intro-1">>who knows what is awaiting?</span><br />
                <span id="intro-1">>good luck.</span><br />
                <span id="intro-1">><span class="bar">i</span></span
                ><br />
            </div>

            <span class="global-timer main-game" id="global-timer"
                >23:55:50</span
            >
        </div>
        <div id="main-countdowns" class="main-game"></div>
        <audio
            id="ingame-music"
            src="assets/ingame_music.mp3"
            loop
            preload
        ></audio>

        <div class="video-player">
            <video src="assets/video.mp4" id="video-el" preload></video>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <script src="assets/SplitText.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
